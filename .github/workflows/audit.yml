name: Course Quality Audit & CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install numpy==1.26.4 pandas==2.2.0 scikit-learn==1.4.2

      - name: Install Node dependencies
        run: npm ci

      - name: Run full course audit, typecheck, lint & build
        run: npm run audit:ci
